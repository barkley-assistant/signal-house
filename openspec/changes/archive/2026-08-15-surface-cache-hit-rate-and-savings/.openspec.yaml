schema: spec-driven
created: 2026-08-15
goal: "Surface prompt cache hit rate and cache savings on the dashboard. The
  data is already collected (tokens_cache_read in opencode collector,
  cache_read_tokens in hermes collector, summed into daily_metrics) but never
  reaches the UI. Add: (1) a new card showing windowed cache hit rate,
  cache_read tokens, and estimated $ saved via cache_read × cost.input_rate /
  1e6; (2) a cache-hit-rate column on the by-model table; (3) a 4th series for
  cache_read on the daily-token-usage chart; (4) additive server-side
  aggregation fields on the API response; (5) tests for the rate formula,
  by-model sort, and an e2e. Additive to existing shapes — no breaking changes."
